<style>
  html,body{margin:0;height:100%;background:#f5f5f7;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #carregando{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(700px 420px at 50% 40%,rgba(142,53,189,.10),transparent 70%),#f5f5f7;transition:opacity .5s ease,transform .5s ease;font-family:Inter,system-ui,sans-serif}
  #carregando.sai{opacity:0;transform:scale(1.03);pointer-events:none}
  .logo{display:flex;align-items:center;gap:clamp(16px,4vw,30px);width:min(82vw,560px)}
  .leao{width:48%;flex:none;color:#8e35bd;opacity:0;transform:translateX(-46px);animation:leaoEntra .9s cubic-bezier(.2,.8,.2,1) .1s forwards}
  .leao svg{display:block;width:100%;height:auto;overflow:visible}
  .leao path{filter:drop-shadow(0 10px 18px rgba(142,53,189,.25))}
  .div{width:1.5px;align-self:stretch;margin:4% 0;background:#d1d1d6;transform:scaleY(0);animation:divCresce .5s ease .75s forwards}
  .txt{display:flex;flex-direction:column;line-height:.92}
  .txt b{font-weight:800;font-size:clamp(34px,10vw,74px);letter-spacing:-.01em;color:#0b0b0f;clip-path:inset(0 100% 0 0);animation:revela .6s cubic-bezier(.6,0,.2,1) .95s forwards}
  .txt span{font-weight:400;font-size:clamp(26px,7.6vw,56px);color:#8e35bd;margin-top:2px;opacity:0;transform:translateY(10px);animation:sobe .5s ease 1.35s forwards}
  .barra{position:absolute;left:50%;bottom:22%;width:120px;height:3px;margin-left:-60px;border-radius:3px;background:#e7e3ee;overflow:hidden;opacity:0;animation:sobe .4s ease 1.6s forwards}
  .barra:after{content:'';position:absolute;inset:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#8e35bd,#d946ef);animation:corre 1.1s ease-in-out infinite}
  @keyframes leaoEntra{60%{opacity:1;transform:translateX(4px)}100%{opacity:1;transform:none}}
  @keyframes divCresce{to{transform:scaleY(1)}}
  @keyframes revela{to{clip-path:inset(0 0 0 0)}}
  @keyframes sobe{to{opacity:1;transform:none}}
  @keyframes corre{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .leao.respira{animation:respira 2.4s ease-in-out infinite;opacity:1;transform:none}
  @keyframes respira{50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.leao,.div,.txt b,.txt span,.barra{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}
</style>
</head>
<body>
<div id="carregando"><div class="logo" role="img" aria-label="LI-ON Group"><div class="leao"><svg viewBox="0 0 618 278" aria-hidden="true"><path fill="currentColor" d="M213 278L177 278L177 277L186 270L196 263L208 263L215 259L221 256L221 210L199 204L177 198L175 199L175 205L174 212L172 217L165 212L158 207L138 195L120 183L110 176L100 170L98 172L97 180L96 188L95 189L76 170L56 151L55 151L45 156L35 160L33 160L17 140L2 120L0 117L13 103L27 88L28 83L28 77L41 67L54 58L54 52L55 41L56 30L76 17L96 4L97 4L99 8L102 12L103 12L116 6L128 0L157 4L186 7L188 9L181 14L174 19L178 21L204 25L231 30L235 30L235 32L229 44L223 55L224 56L231 54L238 52L258 55L278 58L310 63L343 67L374 64L405 60L441 68L476 76L480 78L526 110L571 142L573 142L578 139L584 137L584 134L583 130L582 126L600 110L618 93L618 96L612 121L607 146L604 149L588 154L571 160L531 133L492 106L481 99L471 92L451 92L431 92L439 103L448 114L466 138L485 162L488 165L504 168L519 171L521 172L526 184L531 194L540 215L550 236L556 248L562 262L565 264L561 271L557 278L524 278L492 278L500 269L507 260L519 260L530 260L530 259L514 238L499 217L473 217L446 218L424 206L402 195L387 187L372 179L353 186L334 194L314 201L294 209L293 209L285 200L278 191L276 191L270 209L265 226L257 252L248 278Z"/></svg></div><i class="div"></i><div class="txt"><b>LI-ON</b><span>Group</span></div></div><i class="barra"></i></div>
<script>
  // Endereço do sistema no Google (Apps Script)
  var APP = 'https://script.google.com/macros/s/AKfycbyimzOHZXMS_SElbyAV_WH59SPS8Q82591F1XbcXxI8u7HP8RHA7__1qEvKpoL-0XWM/exec';
  // Endereços das abas da agência: sistemalionmkt.com.br/teleprompter, /cronograma ...
  var ROTAS = {
    aprovacoes: ['admin', 'Aprovações'], cronograma: ['cronograma', 'Cronograma'], agenda: ['agendapainel', 'Agenda'],
    orcamentos: ['orcamentos', 'Orçamentos'], gerador: ['gerador', 'Gerador'], teleprompter: ['prompter', 'Teleprompter']
  };
  var CH = 'lionChave';
  function lerChave() { try { return localStorage.getItem(CH) || ''; } catch (e) { return ''; } }
  function salvarChave(k) { try { localStorage.setItem(CH, k); } catch (e) {} }
  var q = new URLSearchParams(location.search);
  var rota = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0].toLowerCase();
  // link antigo (?cronograma=CHAVE): guarda a chave neste aparelho e mostra o endereço curto
  Object.keys(ROTAS).forEach(function (r) {
    var p = ROTAS[r][0];
    if (q.get(p)) { salvarChave(q.get(p)); q.delete(p); rota = r; }
  });
  if (q.get('k')) { salvarChave(q.get('k')); q.delete('k'); }
  var src = APP + location.search, erro = '';
  if (ROTAS[rota]) {
    var resto = q.toString();
    try { history.replaceState(null, '', '/' + rota + (resto ? '?' + resto : '')); } catch (e) {}
    document.title = ROTAS[rota][1] + ' · Li-On';
    var k = lerChave();
    if (!k) erro = 'Este aparelho ainda não tem acesso.<br>Abra uma vez o link completo do painel (com a chave) e depois use este endereço.';
    q.set(ROTAS[rota][0], k);
    src = APP + '?' + q.toString();
  }
  if (erro) {
    document.querySelector('#carregando .barra').remove(); document.getElementById('carregando').insertAdjacentHTML('beforeend', '<div style="position:absolute;bottom:14%;left:0;right:0;margin:auto;text-align:center;max-width:340px;line-height:1.6;padding:20px;color:#1d1630">' + erro + '</div>');
  } else {
    var f = document.createElement('iframe');
    f.src = src;
    f.allow = 'autoplay; fullscreen; clipboard-write; screen-wake-lock';
    f.setAttribute('allowfullscreen', '');
    var T0 = Date.now();
    f.onload = function () { var c = document.getElementById('carregando'); if (!c) return; setTimeout(function () { c.classList.add('sai'); setTimeout(function () { c.remove(); }, 520); }, Math.max(0, 1900 - (Date.now() - T0))); };
    setTimeout(function () { var l = document.querySelector('#carregando .leao'); if (l) l.classList.add('respira'); }, 1100);
    document.body.appendChild(f);
  }
</script>
</body>
</html>
