<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aprovação de artes · Li-On</title>
<meta name="theme-color" content="#08070c">
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#08070c;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #carregando{position:fixed;inset:0;display:grid;place-items:center;color:#c4b5fd;font:600 15px system-ui,sans-serif;transition:opacity .4s}
  #carregando i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(196,181,253,.25);border-top-color:#a855f7;animation:g 1s linear infinite;display:block;margin:0 auto 12px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="carregando"><div><i></i>Carregando…</div></div>
<script>
  // Endereço do sistema no Google (Apps Script). Os parâmetros da barra (?cliente=, ?admin=, ?gerador=) são repassados.
  var APP = 'https://script.google.com/macros/s/AKfycbyimzOHZXMS_SElbyAV_WH59SPS8Q82591F1XbcXxI8u7HP8RHA7__1qEvKpoL-0XWM/exec';
  var f = document.createElement('iframe');
  f.src = APP + location.search;
  f.allow = 'autoplay; fullscreen; clipboard-write';
  f.setAttribute('allowfullscreen', '');
  f.onload = function () { var c = document.getElementById('carregando'); c.style.opacity = 0; setTimeout(function () { c.remove(); }, 400); };
  document.body.appendChild(f);
</script>
</body>
</html>
